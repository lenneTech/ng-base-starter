<lt-page-card class="w-full max-w-md" icon="lucideUser" title="Anmelden">
  <form [formRoot]="loginForm" class="flex flex-col gap-4">
    <lt-form-field for="login-email" label="E-Mail" [error]="fieldError(loginForm.email)" [required]="true">
      <input hlmInput id="login-email" type="email" autocomplete="username" placeholder="E-Mail eingeben" [formField]="loginForm.email" aria-describedby="login-email-error" />
    </lt-form-field>

    <lt-form-field for="login-password" label="Passwort" [error]="fieldError(loginForm.password)" [required]="true">
      <lt-password-input id="login-password" autocomplete="current-password" placeholder="Passwort eingeben" [formField]="loginForm.password" />
    </lt-form-field>
    <a routerLink="/auth/forgot-password" class="-mt-2 self-end text-sm font-medium text-primary hover:underline" tabindex="-1">Passwort vergessen?</a>

    <button hlmBtn type="submit" class="w-full" [disabled]="loading()">Anmelden</button>
  </form>

  <div ltPageCardFooter class="flex flex-col gap-4">
    <div class="flex items-center gap-3" role="presentation">
      <hlm-separator class="flex-1" />
      <span class="text-sm text-muted-foreground">oder</span>
      <hlm-separator class="flex-1" />
    </div>

    <button hlmBtn variant="outline" type="button" class="w-full" [disabled]="passkeyLoading()" (click)="signInWithPasskey()">
      <ng-icon name="lucideKeyRound" aria-hidden="true" />
      Mit Passkey anmelden
    </button>

    @if (signUpEnabled()) {
      <p class="text-center text-sm text-muted-foreground">
        Noch kein Konto?
        <a routerLink="/auth/register" class="font-medium text-primary hover:underline">Registrieren</a>
      </p>
    }
  </div>
</lt-page-card>
