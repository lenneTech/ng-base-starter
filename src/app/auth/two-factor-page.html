<lt-page-card class="w-full max-w-md">
  <div class="flex flex-col gap-6">
    <div class="flex flex-col items-center gap-2">
      <ng-icon name="lucideShieldCheck" size="3rem" class="text-primary" aria-hidden="true" />
      <h1 class="text-xl font-semibold">Zwei-Faktor-Authentifizierung</h1>
      <p class="text-center text-sm text-muted-foreground">
        {{ useBackupCode() ? 'Gib einen deiner Backup-Codes ein' : 'Gib den 6-stelligen Code aus deiner Authenticator-App ein' }}
      </p>
    </div>

    <form [formRoot]="codeForm" class="flex flex-col gap-4">
      <lt-form-field for="two-factor-code" [label]="useBackupCode() ? 'Backup-Code' : 'Authentifizierungscode'" [error]="fieldError(codeForm.code)">
        <input
          hlmInput
          id="two-factor-code"
          class="text-center font-mono text-lg tracking-widest"
          autocomplete="one-time-code"
          [attr.inputmode]="useBackupCode() ? 'text' : 'numeric'"
          [placeholder]="useBackupCode() ? 'Backup-Code eingeben' : '000000'"
          [formField]="codeForm.code"
          aria-describedby="two-factor-code-error"
        />
      </lt-form-field>
      <button hlmBtn type="submit" class="w-full" [disabled]="loading()">Verifizieren</button>
    </form>

    <div class="flex flex-col items-center gap-2">
      <button hlmBtn variant="link" type="button" (click)="toggleBackupCode()">
        {{ useBackupCode() ? 'Authenticator-Code verwenden' : 'Backup-Code verwenden' }}
      </button>
      <a routerLink="/auth/login" class="text-sm text-muted-foreground hover:text-primary">Zurück zur Anmeldung</a>
    </div>
  </div>
</lt-page-card>
