@if (resetSuccess()) {
  <lt-page-card class="w-full max-w-md">
    <div class="flex flex-col items-center gap-6">
      <ng-icon name="lucideCircleCheck" size="4rem" class="text-success" aria-hidden="true" />
      <div class="text-center">
        <h1 #successHeading tabindex="-1" class="text-xl font-semibold outline-none">Passwort zurückgesetzt</h1>
        <p class="mt-2 text-sm text-muted-foreground">Dein Passwort wurde erfolgreich geändert. Du kannst dich jetzt mit deinem neuen Passwort anmelden.</p>
      </div>
      <a hlmBtn class="w-full" routerLink="/auth/login">Zur Anmeldung</a>
    </div>
  </lt-page-card>
} @else {
  <lt-page-card class="w-full max-w-md" icon="lucideShieldCheck" title="Neues Passwort">
    @if (submitError()) {
      <lt-notice
        class="mb-4"
        [variant]="submitErrorKind() === 'link' ? 'error' : 'warning'"
        [title]="submitErrorKind() === 'link' ? 'Link nicht mehr gültig' : 'Gerade nicht möglich'"
      >
        {{ submitError() }}
      </lt-notice>
    }
    <form [formRoot]="passwordForm" class="flex flex-col gap-4">
      <lt-form-field for="reset-password" label="Neues Passwort" [error]="fieldError(passwordForm.password)" [required]="true">
        <lt-password-input id="reset-password" autocomplete="new-password" placeholder="Neues Passwort eingeben" [formField]="passwordForm.password" />
      </lt-form-field>
      <lt-form-field for="reset-confirm-password" label="Passwort bestätigen" [error]="fieldError(passwordForm.confirmPassword)" [required]="true">
        <lt-password-input id="reset-confirm-password" autocomplete="new-password" placeholder="Passwort wiederholen" [formField]="passwordForm.confirmPassword" />
      </lt-form-field>
      @if (passwordError()) {
        <lt-notice variant="error" title="Passwort ungültig">{{ passwordError() }}</lt-notice>
      }
      <button hlmBtn type="submit" class="w-full" [disabled]="loading() || !isTokenValid()">Passwort speichern</button>
    </form>
    <p ltPageCardFooter class="text-center text-sm">
      <a routerLink="/auth/forgot-password" class="font-medium text-primary hover:underline">Neuen Link anfordern</a>
    </p>
  </lt-page-card>
}
