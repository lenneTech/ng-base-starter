<div class="mx-auto max-w-4xl space-y-6 px-4 py-8">
  <div>
    <h1 class="text-2xl font-bold">Administration</h1>
    <p class="text-muted-foreground">Verwaltungsbereiche für Administratoren.</p>
  </div>
  <ul class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    @for (card of cards(); track card.link) {
      <li>
        <a hlmCard [routerLink]="card.link" class="block h-full p-6 transition hover:ring-2 hover:ring-primary focus-visible:ring-2 focus-visible:ring-ring">
          <span class="flex items-start gap-3">
            <ng-icon [name]="card.icon" size="1.5rem" class="shrink-0 text-primary" aria-hidden="true" />
            <span>
              <span class="block font-semibold">{{ card.title }}</span>
              <span class="block text-sm text-muted-foreground">{{ card.description }}</span>
            </span>
          </span>
        </a>
      </li>
    }
  </ul>
</div>
