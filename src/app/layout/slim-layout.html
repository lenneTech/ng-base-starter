<div class="min-h-screen">
  <a

    class="sr-only rounded-md bg-background px-4 py-2 text-foreground focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:ring-2 focus:ring-primary"
  >
    Zum Inhalt springen
  </a>
  <main #main id="main-content" tabindex="-1" class="flex min-h-screen items-center justify-center px-4 py-8 outline-none">
    <router-outlet />
  </main>
</div>
