@if (visible()) {
  <span
    class="inline-flex size-6 items-center justify-center rounded-md outline-none focus-visible:ring-2 focus-visible:ring-ring"
    role="img"
    tabindex="0"
    [showDelay]="100"
    [attr.aria-label]="ariaLabel()"
    [hlmTooltip]="tooltip"
  >
    <svg viewBox="0 0 20 20" class="size-5 -rotate-90" aria-hidden="true" focusable="false" [class]="ringClass()">
      <circle cx="10" cy="10" fill="none" stroke="currentColor" stroke-opacity="0.15" stroke-width="2.5" [attr.r]="radius" />
      <circle
        cx="10"
        cy="10"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        class="transition-[stroke-dashoffset] duration-300 motion-reduce:transition-none"
        [attr.r]="radius"
        [attr.stroke-dasharray]="circumference"
        [attr.stroke-dashoffset]="dashOffset()"
      />
    </svg>
  </span>
}

<ng-template #tooltip>
  @for (line of tooltipLines(); track $index) {
    <span class="block">{{ line }}</span>
  }
</ng-template>
